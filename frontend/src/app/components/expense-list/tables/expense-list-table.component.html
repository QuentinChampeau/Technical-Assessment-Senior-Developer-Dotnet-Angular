<div class="bg-white shadow rounded-lg overflow-hidden">
  <div class="px-6 py-4 border-b border-gray-200">
    <h2 class="text-lg font-semibold text-gray-800">Expense List</h2>
    <p class="text-sm text-gray-500 mt-1">
      Search, filter, sort and paginate expenses
    </p>
  </div>

  <div class="p-5 border-b border-gray-200 bg-gray-50">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Search
        </label>
        <input
          type="text"
          [(ngModel)]="search"
          (keyup.enter)="applyFilters()"
          placeholder="Search description..."
          class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Category
        </label>
        <select
          [(ngModel)]="selectedCategory"
          (change)="applyFilters()"
          class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
        >
          <option value="">All categories</option>
          <option *ngFor="let category of categories" [value]="category">
            {{ category }}
          </option>
        </select>
      </div>

      <div class="flex items-end gap-2 md:col-span-2">
        <button
          type="button"
          (click)="applyFilters()"
          class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded"
        >
          Apply
        </button>

        <button
          type="button"
          (click)="clearFilters()"
          class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded"
        >
          Clear
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="loading()" class="flex justify-center items-center py-10">
    <div
      class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500"
    ></div>
  </div>

  <div *ngIf="!loading() && expenses().length === 0" class="text-center py-10">
    <p class="text-gray-600">No expenses found for the current filters.</p>
  </div>

  <div *ngIf="!loading() && expenses().length > 0" class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            <button
              type="button"
              (click)="onSort('date', $event)"
              class="hover:text-gray-900"
            >
              Date {{ getSortIcon("date") }}
            </button>
          </th>

          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            <button
              type="button"
              (click)="onSort('category', $event)"
              class="hover:text-gray-900"
            >
              Category {{ getSortIcon("category") }}
            </button>
          </th>

          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            <button
              type="button"
              (click)="onSort('description', $event)"
              class="hover:text-gray-900"
            >
              Description {{ getSortIcon("description") }}
            </button>
          </th>

          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            <button
              type="button"
              (click)="onSort('amount', $event)"
              class="hover:text-gray-900"
            >
              Amount {{ getSortIcon("amount") }}
            </button>
          </th>

          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Actions
          </th>
        </tr>
      </thead>

      <tbody class="bg-white divide-y divide-gray-200">
        <tr
          *ngFor="let expense of expenses()"
          class="hover:bg-gray-50 cursor-pointer"
          [routerLink]="['/expenses', expense.id]"
        >
          <td class="px-6 py-4 whitespace-nowrap">
            {{ formatDate(expense.date) }}
          </td>

          <td class="px-6 py-4 whitespace-nowrap">
            {{ expense.category }}
          </td>

          <td class="px-6 py-4">
            <div class="text-sm text-gray-900 truncate max-w-xs">
              {{ expense.description }}
            </div>
          </td>

          <td class="px-6 py-4 whitespace-nowrap">
            <span class="text-sm font-medium text-gray-900">
              {{ expense.amount | number: "1.2-2" }}
            </span>
          </td>

          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <button
              type="button"
              (click)="onDelete(expense.id, $event)"
              class="text-red-600 hover:text-red-900"
            >
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <app-pagination
    [page]="page()"
    [pageSize]="pageSize()"
    [totalCount]="totalCount()"
    (pageChange)="pageChange.emit($event)"
    (pageSizeChange)="pageSizeChange.emit($event)"
  />
</div>
